<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title">
<title id="title">Devin Model Router — One session. The right route.</title>
<defs>
  <radialGradient id="aura"><stop stop-color="#507800" stop-opacity=".12"/><stop offset="1" stop-color="#507800" stop-opacity="0"/></radialGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#507800"/><stop offset="1" stop-color="#087c91"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e1e8f0" stroke-width=".7"/></pattern>
  <clipPath id="card"><rect width="640" height="650" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:Arial,Helvetica,sans-serif} .mono{font-family:'Courier New',monospace}
.pulse{animation:pulse 4s ease-in-out infinite} .flow{stroke-dasharray:4 15;animation:flow 14s linear infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes flow{to{stroke-dashoffset:-152}}
@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<g clip-path="url(#card)">
<rect x="0" y="0" width="640" height="650" rx="0" fill="#f3f6fa" stroke="none" /><rect x="0" y="0" width="640" height="650" rx="0" fill="url(#grid)" stroke="none" /><ellipse cx="512.0" cy="273.0" rx="275.2" ry="585.0" fill="url(#aura)"/><text x="34" y="43" class="mono" font-size="15" font-weight="600" fill="#507800" letter-spacing="1">04 / MODEL ROUTING</text><path d="M580 45L600 25M583 25H600V42" fill="none" stroke="#507800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="114" class="sans" font-size="54" font-weight="700" fill="#17283d" letter-spacing="-2">One session.</text><text x="32" y="172" class="sans" font-size="54" font-weight="700" fill="#17283d" letter-spacing="-2">The right route.</text><text x="34" y="215" class="sans" font-size="23" font-weight="400" fill="#52667d" >Route by expected cost and reliability.</text><g transform="translate(112 265) scale(1.07)"><rect x="0" y="84" width="104" height="64" rx="12" fill="#ffffff" stroke="#cad5e2" /><text x="52" y="110" class="mono" font-size="13" font-weight="600" fill="#52667d" text-anchor="middle">ONE</text><text x="52" y="131" class="mono" font-size="14" font-weight="600" fill="#17283d" text-anchor="middle">SESSION</text><path d="M104 116H130Q155 116 155 34H190" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M104 116H130Q155 116 155 34H190" fill="none" stroke="#507800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="190" y="0" width="197" height="67" rx="10" fill="#ffffff" stroke="#cad5e2" /><circle cx="206" cy="21" r="3" fill="#507800" /><text x="220" y="26" class="mono" font-size="15" font-weight="600" fill="#507800" >FAST</text><text x="206" y="49" class="mono" font-size="11" font-weight="400" fill="#52667d" >lower expected cost</text><path d="M104 116H130Q155 116 155 118H190" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M104 116H130Q155 116 155 118H190" fill="none" stroke="#507800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="190" y="84" width="197" height="67" rx="10" fill="#ffffff" stroke="#cad5e2" /><circle cx="206" cy="105" r="3" fill="#507800" /><text x="220" y="110" class="mono" font-size="15" font-weight="600" fill="#507800" >BALANCED</text><text x="206" y="133" class="mono" font-size="11" font-weight="400" fill="#52667d" >cost × reliability</text><path d="M104 116H130Q155 116 155 202H190" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M104 116H130Q155 116 155 202H190" fill="none" stroke="#507800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="190" y="168" width="197" height="67" rx="10" fill="#ffffff" stroke="#cad5e2" /><circle cx="206" cy="189" r="3" fill="#507800" /><text x="220" y="194" class="mono" font-size="15" font-weight="600" fill="#507800" >DEEP</text><text x="206" y="217" class="mono" font-size="11" font-weight="400" fill="#52667d" >higher capability</text></g><text x="34" y="615" class="mono" font-size="17" font-weight="600" fill="#507800" >PYTHON  /  ACP</text></g><rect x="0.5" y="0.5" width="639" height="649" rx="24" fill="none" stroke="#cad5e2" /></svg>
