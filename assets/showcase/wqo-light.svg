le cx="39" cy="112" r="3" fill="#7555bd"/><text x="62" y="117" class="sans" font-size="18" font-weight="600" fill="#17283d">Simulate</text><text x="170" y="116" class="mono" font-size="12" font-weight="400" fill="#52667d">expressions &amp; backtests</text><circle cx="39" cy="157" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><circle cx="39" cy="157" r="3" fill="#7555bd"/><text x="62" y="162" class="sans" font-size="18" font-weight="600" fill="#17283d">Review</text><text x="170" y="161" class="mono" font-size="12" font-weight="400" fill="#52667d">checks &amp; audit trail</text><circle cx="39" cy="202" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><text x="62" y="207" class="sans" font-size="18" font-weight="600" fill="#17283d">Submit</text><text x="170" y="206" class="mono" font-size="12" font-weight="400" fill="#52667d">explicit approval</text></g></g><rect x=".5" y=".5" width="1039" height="341" rx="24" fill="none" stroke="#cad5e2"/></svg>
