<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="342" viewBox="0 0 1040 342" role="img" aria-labelledby="title"><title id="title">WorldQuant Orchestrator: From an idea to a workflow.</title><defs><radialGradient id="aura"><stop stop-color="#7555bd" stop-opacity=".12"/><stop offset="1" stop-color="#7555bd" stop-opacity="0"/></radialGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#507800"/><stop offset="1" stop-color="#087c91"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e1e8f0" stroke-width=".7"/></pattern><clipPath id="card"><rect width="1040" height="342" rx="24"/></clipPath></defs><style>
