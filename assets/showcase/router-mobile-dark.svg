<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title"><title id="title">Devin Model Router: One session. The right route.</title><defs><radialGradient id="aura"><stop stop-color="#d3fa80" stop-opacity=".12"/><stop offset="1" stop-color="#d3fa80" stop-opacity="0"/></radialGradient><linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3fa80"/><stop offset="1" stop-color="#76deed"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c2939" stroke-width=".7"/></pattern><clipPath id="card"><rect width="640" height="650" rx="24"/></clipPath></defs><style>
