<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="title">
<title id="title">WorldQuant Orchestrator — From an idea to a workflow.</title>
<defs>
  <radialGradient id="aura"><stop stop-color="#7555bd" stop-opacity=".12"/><stop offset="1" stop-color="#7555bd" stop-opacity="0"/></radialGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#507800"/><stop offset="1" stop-color="#087c91"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e1e8f0" stroke-width=".7"/></pattern>
  <clipPath id="card"><rect width="640" height="650" rx="24"/></clipPath>
</defs>
<style>
.sans{font-family:Arial,Helvetica,sans-serif} .mono{font-family:'Courier New',monospace}
.pulse{animation:pulse 4s ease-in-out infinite} .flow{stroke-dasharray:4 15;animation:flow 14s linear infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes flow{to{stroke-dashoffset:-152}}
@media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<g clip-path="url(#card)">
<rect x="0" y="0" width="640" height="650" rx="0" fill="#f3f6fa" stroke="none" /><rect x="0" y="0" width="640" height="650" rx="0" fill="url(#grid)" stroke="none" /><ellipse cx="512.0" cy="273.0" rx="275.2" ry="585.0" fill="url(#aura)"/><text x="34" y="43" class="mono" font-size="15" font-weight="600" fill="#7555bd" letter-spacing="1">03 / RESEARCH AUTOMATION</text><path d="M580 45L600 25M583 25H600V42" fill="none" stroke="#7555bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="114" class="sans" font-size="54" font-weight="700" fill="#17283d" letter-spacing="-2">From an idea</text><text x="32" y="172" class="sans" font-size="54" font-weight="700" fill="#17283d" letter-spacing="-2">to a workflow.</text><text x="34" y="215" class="sans" font-size="23" font-weight="400" fill="#52667d" >Discover. Backtest. Review.</text><g transform="translate(112 265) scale(1.07)"><rect x="0" y="0" width="386" height="246" rx="12" fill="#ffffff" stroke="#cad5e2" /><circle cx="15" cy="17" r="3" fill="#7555bd" /><text x="28" y="21" class="mono" font-size="12" font-weight="600" fill="#52667d" >research.workflow</text><path d="M0 34L386 34" fill="none" stroke="#cad5e2" stroke-width="1" /><path d="M39 72V199" fill="none" stroke="#cad5e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M39 72V199" fill="none" stroke="#7555bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="39" cy="67" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><circle cx="39" cy="67" r="3" fill="#7555bd" /><text x="62" y="72" class="sans" font-size="18" font-weight="600" fill="#17283d" >Discover</text><text x="170" y="71" class="mono" font-size="12" font-weight="400" fill="#52667d" >datasets &amp; fields</text><circle cx="39" cy="112" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><circle cx="39" cy="112" r="3" fill="#7555bd" /><text x="62" y="117" class="sans" font-size="18" font-weight="600" fill="#17283d" >Simulate</text><text x="170" y="116" class="mono" font-size="12" font-weight="400" fill="#52667d" >expressions &amp; backtests</text><circle cx="39" cy="157" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><circle cx="39" cy="157" r="3" fill="#7555bd" /><text x="62" y="162" class="sans" font-size="18" font-weight="600" fill="#17283d" >Review</text><text x="170" y="161" class="mono" font-size="12" font-weight="400" fill="#52667d" >checks &amp; audit trail</text><circle cx="39" cy="202" r="8" fill="#f3f6fa" stroke="#7555bd" stroke-width="2"/><text x="62" y="207" class="sans" font-size="18" font-weight="600" fill="#17283d" >Submit</text><text x="170" y="206" class="mono" font-size="12" font-weight="400" fill="#52667d" >explicit approval</text></g><text x="34" y="615" class="mono" font-size="17" font-weight="600" fill="#7555bd" >PYTHON  /  SQLITE</text></g><rect x="0.5" y="0.5" width="639" height="649" rx="24" fill="none" stroke="#cad5e2" /></svg>
